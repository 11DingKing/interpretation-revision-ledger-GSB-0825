services:
  db:
    image: postgres:16-alpine
    container_name: readingledger-db
    environment:
      POSTGRES_DB: readingledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d readingledger"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
